<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChasePay — Update Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      background-color: var(--cream);
    }

    body::after {
      content: '';
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(37, 99, 235, 0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-wrap {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.55s both;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.4rem 2.2rem;
      box-shadow: 0 8px 40px rgba(15, 14, 12, 0.06);
    }

    .auth-heading {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.55rem;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }

    .auth-sub {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.55;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .auth-submit {
      width: 100%;
      padding: 0.85rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      background: var(--ink);
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.2s, transform 0.15s;
    }

    .auth-submit:hover {
      background: var(--accent);
      transform: translateY(-1px);
    }

    .auth-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #status-msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    #status-msg.error {
      background: #fee2e2;
      color: #b91c1c;
      display: block;
    }

    #status-msg.success {
      background: #dcfce7;
      color: #15803d;
      display: block;
    }
  </style>
</head>

<body>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2 class="auth-heading">Set new password</h2>
      <p class="auth-sub">Choose a strong password to secure your account.</p>

      <div class="auth-form">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" id="new-password" class="form-input" placeholder="Min 8 characters">
          <button class="input-eye" onclick="togglePw('login-password', this)">👁</button>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-input" placeholder="Repeat new password">
        </div>

        <button id="update-btn" class="auth-submit">Update password →</button>
      </div>

      <div id="status-msg"></div>
    </div>
  </div>

  <script>
    // Extract token from URL fragment
    const getHashToken = () => {
      const hash = window.location.hash;
      if (hash) {
        const params = new URLSearchParams(hash.substring(1));
        return params.get('access_token');
      }
      return null;
    };

    document.getElementById('update-btn').addEventListener('click', async () => {
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      const btn = document.getElementById('update-btn');
      const msg = document.getElementById('status-msg');
      const token = getHashToken();

      if (!token) {
        msg.textContent = 'Invalid or expired session. Please request a new reset link.';
        msg.className = 'error';
        return;
      }

      if (!password || password.length < 8) {
        msg.textContent = 'Password must be at least 8 characters';
        msg.className = 'error';
        return;
      }

      if (password !== confirm) {
        msg.textContent = 'Passwords do not match';
        msg.className = 'error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const response = await fetch('http://localhost:8000/api/auth/update-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, token })
        });

        if (response.ok) {
          msg.textContent = 'Password updated! Redirecting to login...';
          msg.className = 'success';
          setTimeout(() => window.location.href = 'index.html', 2000);
        } else {
          const data = await response.json();
          msg.textContent = data.detail || 'Failed to update password';
          msg.className = 'error';
          btn.disabled = false;
          btn.textContent = 'Update password →';
        }
      } catch (error) {
        msg.textContent = 'Server error. Please try again.';
        msg.className = 'error';
        btn.disabled = false;
        btn.textContent = 'Update password →';
      }
    });
  </script>
</body>

</html>
