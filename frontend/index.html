<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChasePay - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl p-8 border border-white/20">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-white tracking-tight">ChasePay</h1>
            <p class="text-blue-200 mt-2 font-medium">Automate your invoice reminders with AI</p>
        </div>

        <div id="auth-form">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-blue-100 mb-1">Email Address</label>
                <input type="email" id="email" class="w-full px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="name@company.com">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-blue-100 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="••••••••">
            </div>
            
            <button id="login-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-500 shadow-lg shadow-blue-600/30 transition duration-300 active:scale-[0.98]">Sign In</button>
            <button id="signup-btn" class="w-full mt-4 text-white font-semibold py-3 rounded-lg border border-white/20 hover:bg-white/10 transition duration-300">Create Free Account</button>
        </div>

        <div id="status-msg" class="mt-4 text-center text-sm hidden"></div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
