<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChasePay - Clients</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: theme('colors.bg');
      color: theme('colors.text');
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }

    .font-mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── Sidebar (Hover-to-Expand) ── */
    aside {
      width: 84px !important;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      height: calc(100vh - 64px) !important;
      min-height: calc(100vh - 64px) !important;
      position: sticky;
      top: 0;
      overflow-x: hidden;
      z-index: 40;
      background-color: #EFEFEA;
    }

    aside:hover {
      width: 260px !important;
    }

    .nav-label,
    .full-label {
      opacity: 0;
      max-width: 0;
      visibility: hidden;
      white-space: nowrap;
      transition: opacity 0.3s ease, max-width 0.3s ease, transform 0.3s ease, visibility 0.3s;
      transform: translateX(-10px);
      display: inline-block;
      vertical-align: middle;
    }

    aside:hover .nav-label,
    aside:hover .full-label {
      opacity: 1;
      max-width: 200px;
      visibility: visible;
      transform: translateX(0);
    }

    .short-label {
      display: inline-block;
      opacity: 0.6;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
      max-width: 50px;
    }

    aside:hover .short-label {
      opacity: 0;
      max-width: 0;
      overflow: hidden;
      margin-right: 0;
    }

    aside nav a {
      justify-content: flex-start;
      padding-left: 30px !important;
      transition: background 0.2s ease, padding 0.4s cubic-bezier(0.4, 0, 0.2, 1), border 0.2s ease;
    }

    aside:hover nav a {
      padding-left: 24px !important;
    }

    .nav-active {
      background: #FFFFFF !important;
      border-left: 3px solid var(--accent-color, #FFB200) !important;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.02);
    }

    .nav-active span {
      color: var(--accent-color, #FFB200) !important;
      opacity: 1 !important;
    }

    /* ── Minimalist Modal Style ── */
    .cm-card {
      background: #ffffff;
      border: 1px solid #E8E8E1;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 10;
      padding: 40px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
    }

    .cm-header {
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cm-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #111;
      letter-spacing: -0.02em;
    }

    .cm-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      display: block;
      margin-bottom: 6px;
    }

    .cm-input {
      width: 100%;
      height: 44px;
      padding: 0 16px;
      background: #F9F9F7;
      border: 1px solid #E8E8E1;
      border-radius: 8px;
      font-size: 13px;
      color: #111;
      transition: all 0.2s ease;
    }

    .cm-input:focus {
      background: #FFF;
      border-color: #111;
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.02);
    }

    .cm-textarea {
      width: 100%;
      padding: 12px 16px;
      background: #F9F9F7;
      border: 1px solid #E8E8E1;
      border-radius: 8px;
      font-size: 13px;
      color: #111;
      resize: none;
      transition: all 0.2s ease;
    }

    .cm-textarea:focus {
      background: #FFF;
      border-color: #111;
      outline: none;
    }

    .cm-footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #F0F0EB;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .cm-btn-secondary {
      padding: 10px 20px;
      background: #FFF;
      border: 1px solid #E8E8E1;
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #111;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cm-btn-secondary:hover {
      background: #F9F9F7;
      border-color: #111;
    }

    .cm-btn-primary {
      padding: 10px 24px;
      background: #111;
      border: none;
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #FFF;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cm-btn-primary:hover {
      background: #333;
      transform: translateY(-1px);
    }
  </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

  <!-- Top Navbar -->
  <header class="bg-dark text-white h-16 flex items-center justify-between px-6 sticky top-0 z-40">
    <div class="flex items-center gap-6">
      <a href="dashboard.html" class="font-heading font-bold text-xl tracking-tighter text-white">
        CHASE<span class="text-amber">PAY</span>
      </a>
      <div class="hidden md:flex items-center gap-4 text-xs font-mono font-medium text-gray-400">
        <a href="#" class="hover:text-white transition-colors flex items-center gap-1">Org <svg class="w-3 h-3"
            fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg></a>
        <span class="text-gray-600">/</span>
        <a href="#" class="hover:text-white transition-colors flex items-center gap-1">Workspace <svg class="w-3 h-3"
            fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg></a>
      </div>
    </div>
    <div class="flex items-center gap-4 text-xs font-mono font-medium text-gray-400">
      <button onclick="logout()"
        class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center hover:text-red hover:border-red transition-colors"
        title="Logout">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-[#EFEFEA] border-r border-border overflow-y-auto hidden md:flex flex-col shrink-0">
      <div class="py-6 flex flex-col gap-8 flex-1">
        <div>
          <h4
            class="nav-group-header px-6 text-[10px] font-mono uppercase tracking-widest text-muted mb-2 font-bold flex justify-start">
            <span class="full-label">Dashboard</span>
            <span class="short-label">DAS</span>
          </h4>
          <nav class="flex flex-col">
            <a href="dashboard.html"
              class="flex items-center px-6 py-3 text-sm font-semibold text-muted hover:text-text hover:bg-white/30 border-l-[3px] border-transparent transition-colors">
              <span class="mr-3 opacity-60"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                  </path>
                </svg></span>
              <span class="nav-label">Overview</span>
            </a>
            <a href="invoices.html"
              class="flex items-center px-6 py-3 text-sm font-semibold text-muted hover:text-text hover:bg-white/30 border-l-[3px] border-transparent transition-colors">
              <span class="mr-3 opacity-60"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                  </path>
                </svg></span>
              <span class="nav-label">Invoices</span>
            </a>
            <a href="clients.html"
              class="nav-active flex items-center px-6 py-3 text-sm font-semibold text-text bg-white border-l-[3px] border-amber relative">
              <span class="mr-3 text-amber"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                  </path>
                </svg></span>
              <span class="nav-label">Clients</span>
            </a>
            <a href="create-invoice.html"
              class="flex items-center px-6 py-3 text-sm font-semibold text-muted hover:text-text hover:bg-white/30 border-l-[3px] border-transparent transition-colors">
              <span class="mr-3 opacity-60"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg></span>
              <span class="nav-label">Create Invoice</span>
            </a>
          </nav>
        </div>
        <div>
          <h4
            class="nav-group-header px-6 text-[10px] font-mono uppercase tracking-widest text-muted mb-2 font-bold flex justify-start">
            <span class="full-label">Environment</span>
            <span class="short-label">ENV</span>
          </h4>
          <nav class="flex flex-col">
            <a href="settings.html"
              class="flex items-center px-6 py-3 text-sm font-semibold text-muted hover:text-text hover:bg-white/30 border-l-[3px] border-transparent transition-colors">
              <span class="mr-3 opacity-60"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                  </path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg></span>
              <span class="nav-label">Settings</span>
            </a>
          </nav>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 lg:p-12 overflow-y-auto bg-card">
      <header class="flex justify-between items-end mb-8 border-b border-border pb-6">
        <div>
          <h1 class="font-heading font-bold text-3xl text-text mb-2">Clients</h1>
          <p class="text-sm text-muted">Manage your client relationships and contact details.</p>
        </div>
        <div class="flex items-center gap-4">
          <button onclick="openAddModal()"
            class="px-5 py-2.5 bg-text text-white rounded-full text-xs font-mono font-bold uppercase tracking-widest hover:bg-muted transition-colors shadow-sm">
            Add Client
          </button>
        </div>
      </header>

      <div class="bg-white border border-border rounded-2xl shadow-soft overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse min-w-[800px]">
            <thead class="bg-bg border-b border-border">
              <tr>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider">Client
                  Name</th>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider">Email</th>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider">
                  Relationship</th>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider">Phone</th>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider">Address
                </th>
                <th
                  class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider text-right">
                  Actions</th>
              </tr>
            </thead>
            <tbody id="clients-tbody" class="divide-y divide-border">
              <!-- Loaded via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Client Modal (Add/Edit) -->
  <div id="client-modal" class="modal opacity-0 invisible fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-[#888888]/70 backdrop-blur-sm transition-opacity" onclick="toggleModal()"></div>
    <div class="cm-card">
      <div class="cm-header">
        <h3 id="modal-title" class="cm-title">Add Client</h3>
        <button onclick="toggleModal()" class="text-muted hover:text-text transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <form id="client-form" class="space-y-6">
        <input type="hidden" id="client-id">

        <div>
          <label class="cm-label">Company Name</label>
          <input type="text" id="company_name" required class="cm-input" placeholder="e.g. Acme Corp">
        </div>

        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="cm-label">Contact Person</label>
            <input type="text" id="contact_name" class="cm-input" placeholder="John Doe">
          </div>
          <div>
            <label class="cm-label">Email Address</label>
            <input type="email" id="email" required class="cm-input" placeholder="john@acme.com">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="cm-label">Phone Number</label>
            <input type="text" id="phone" class="cm-input" placeholder="+1 234 567 890">
          </div>
          <div>
            <label class="cm-label">Relationship</label>
            <select id="relationship" class="cm-input font-mono text-[11px]">
              <option value="Regular Client">REGULAR CLIENT</option>
              <option value="VIP">VIP PARTNER</option>
              <option value="New Client">NEW CLIENT</option>
              <option value="Partnership">STRATEGIC PARTNER</option>
            </select>
          </div>
        </div>

        <div>
          <label class="cm-label">Office Address</label>
          <input type="text" id="address" class="cm-input" placeholder="123 Business St, Suite 100">
        </div>

        <div>
          <label class="cm-label">Internal Notes</label>
          <textarea id="notes" rows="3" class="cm-textarea"
            placeholder="Add any specific details about this client..."></textarea>
        </div>

        <div class="cm-footer">
          <button type="button" onclick="toggleModal()" class="cm-btn-secondary">Cancel</button>
          <button type="submit" class="cm-btn-primary">Save Client</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    let allClients = [];

    function toggleModal() {
      const modal = document.getElementById('client-modal');
      const isHidden = modal.classList.contains('opacity-0');
      if (isHidden) {
        modal.classList.remove('opacity-0', 'invisible');
        document.body.classList.add('modal-active');
      } else {
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('invisible'), 250);
        document.body.classList.remove('modal-active');
      }
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add Client';
      document.getElementById('client-form').reset();
      document.getElementById('client-id').value = '';
      toggleModal();
    }

    function openEditModal(id) {
      const client = allClients.find(c => c.id === id);
      if (!client) return;

      document.getElementById('modal-title').textContent = 'Edit Client';
      document.getElementById('client-id').value = client.id;
      document.getElementById('company_name').value = client.company_name;
      document.getElementById('contact_name').value = client.contact_name || '';
      document.getElementById('email').value = client.email;
      document.getElementById('phone').value = client.phone || '';
      document.getElementById('address').value = client.address || '';
      document.getElementById('relationship').value = client.relationship || 'Regular Client';
      document.getElementById('notes').value = client.notes || '';

      toggleModal();
    }

    function renderClients(clients) {
      const tbody = document.getElementById('clients-tbody');
      if (!clients || clients.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-muted">No clients found. Add your first client to get started.</td></tr>`;
        return;
      }
      tbody.innerHTML = clients.map(client => `
        <tr class="hover:bg-bg transition-colors group">
          <td class="px-6 py-4 border-l-[3px] border-transparent group-hover:border-amber transition-colors">
            <p class="font-medium text-sm text-text">${client.company_name}</p>
            <p class="text-[11px] text-muted font-mono mt-1">${client.contact_name || 'No contact name'}</p>
          </td>
          <td class="px-6 py-4 text-sm text-text font-mono">${client.email}</td>
          <td class="px-6 py-4">
            <span class="inline-flex items-center px-2 py-1 rounded text-[10px] font-mono font-bold uppercase tracking-wider bg-blue/10 text-blue border border-blue/20">
              ${client.relationship || 'Regular Client'}
            </span>
          </td>
          <td class="px-6 py-4 text-sm text-muted font-mono">${client.phone || '—'}</td>
          <td class="px-6 py-4 text-sm text-muted max-w-[200px] truncate">${client.address || '—'}</td>
          <td class="px-6 py-4 text-right">
            <div class="flex items-center justify-end gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
              <button onclick="openEditModal('${client.id}')" class="text-[11px] font-mono font-bold text-blue hover:text-[#036be5] uppercase transition-colors">Edit</button>
              <button onclick="deleteClient('${client.id}')" class="text-[11px] font-mono font-bold text-red hover:text-[#c92f2f] uppercase transition-colors">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function loadClients() {
      const clients = await fetchWithAuth('/clients/');
      if (clients) {
        allClients = clients;
        renderClients(clients);
      }
    }

    document.getElementById('client-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('client-id').value;
      const payload = {
        company_name: document.getElementById('company_name').value,
        contact_name: document.getElementById('contact_name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        relationship: document.getElementById('relationship').value,
        notes: document.getElementById('notes').value
      };

      const method = id ? 'PUT' : 'POST';
      const url = id ? `/clients/${id}` : '/clients/';

      const res = await fetchWithAuth(url, {
        method: method,
        body: JSON.stringify(payload)
      });

      if (res && !res.detail) {
        toggleModal();
        loadClients();
      } else if (res && res.detail) {
        alert(res.detail);
      }
    });

    async function deleteClient(id) {
      if (confirm('Are you sure you want to delete this client? This will not delete their invoices but will remove them from your list.')) {
        const res = await fetchWithAuth(`/clients/${id}`, { method: 'DELETE' });
        if (res) loadClients();
      }
    }

    loadClients();
  </script>
</body>

</html>
