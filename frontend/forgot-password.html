<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChasePay — Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: theme('colors.bg');
      color: theme('colors.text');
      background-image:
        linear-gradient(to right, rgba(215, 215, 208, 0.5) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(215, 215, 208, 0.5) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }

    .font-mono {
      font-family: 'IBM Plex Mono', monospace;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 relative">

  <!-- Mux-style Border -->
  <div class="fixed top-0 left-0 w-2 h-full bg-gradient-to-b from-blue via-pink to-amber z-0"></div>
  <div class="fixed top-0 left-2 w-px h-full bg-border z-0"></div>

  <div class="w-full max-w-md mx-auto relative z-10">
    <div class="bg-card rounded-[36px] shadow-hover border border-border p-10 relative overflow-hidden">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="max-w-7xl mx-auto px-6 lg:px-24 h-16 flex items-center justify-between relative z-10">
          <a href="index.html"
            class="font-heading font-bold text-xl tracking-tighter text-text flex items-center gap-2">
            <svg class="w-5 h-5 text-orange" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
            </svg>
            CHASEPAY
          </a>
        </div>
        <h1 class="font-heading text-2xl font-bold mb-2">Reset password</h1>
        <p class="text-sm text-muted">Enter your email and we'll send you a link to reset your password.</p>
      </div>

      <!-- Form Container -->
      <div class="space-y-4">
        <div>
          <label class="block text-[10px] font-mono font-bold uppercase tracking-widest text-muted mb-2 px-1">Email
            Address</label>
          <input type="email" id="forgot-email"
            class="w-full h-12 px-4 rounded-xl border border-border bg-white text-text focus:outline-none focus:ring-2 focus:ring-blue/50 focus:border-blue transition-all"
            placeholder="name@company.com">
        </div>

        <button id="forgot-btn"
          class="w-full h-12 rounded-full bg-text text-white font-mono font-bold text-xs tracking-widest hover:bg-muted transition-colors mt-2">
          SEND RESET LINK
        </button>

        <div class="text-center pt-4 border-t border-border mt-6">
          <a href="login.html"
            class="text-xs font-mono font-bold uppercase tracking-widest text-muted hover:text-text transition-colors">&larr;
            Back to Log in</a>
        </div>
      </div>

      <!-- Status Message -->
      <div id="status-msg" class="hidden mt-6 p-4 rounded-xl text-sm font-medium text-center border"></div>
    </div>
  </div>

  <script>
    document.getElementById('forgot-btn').addEventListener('click', async () => {
      const email = document.getElementById('forgot-email').value;
      const btn = document.getElementById('forgot-btn');
      const msg = document.getElementById('status-msg');

      if (!email) {
        msg.textContent = 'Please enter your email';
        msg.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center border border-red/20 bg-red/5 text-red';
        msg.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'SENDING...';

      const API_URL = "http://localhost:8000/api";
      try {
        const response = await fetch(`${API_URL}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        if (response.ok) {
          msg.textContent = 'Reset link sent! Check your inbox.';
          msg.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center border border-green/20 bg-green/5 text-green';
          msg.classList.remove('hidden');
          btn.textContent = 'LINK SENT';
        } else {
          const data = await response.json();
          msg.textContent = data.detail || 'Failed to send reset link';
          msg.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center border border-red/20 bg-red/5 text-red';
          msg.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'SEND RESET LINK';
        }
      } catch (error) {
        msg.textContent = 'Server error. Please try again.';
        msg.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center border border-red/20 bg-red/5 text-red';
        msg.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'SEND RESET LINK';
      }
    });
  </script>
</body>

</html>
