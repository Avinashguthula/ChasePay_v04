<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChasePay - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 selection:bg-blue-100 selection:text-blue-900">
    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-white/80 backdrop-blur-md border-r border-slate-200 h-screen sticky top-0 z-50">
            <div class="p-8">
                <h1 class="text-3xl font-black text-blue-600 tracking-tighter">ChasePay</h1>
            </div>
            <nav class="mt-6 px-4">
                <a href="dashboard.html" class="flex items-center px-4 py-3 text-blue-600 bg-blue-50/50 border-r-4 border-blue-600 rounded-l-none rounded-lg mb-2 font-semibold">
                    <span class="mr-3">📊</span> Dashboard
                </a>
                <a href="invoices.html" class="flex items-center px-4 py-3 text-slate-500 hover:text-slate-900 hover:bg-slate-50 rounded-lg mb-2 transition-all duration-200">
                    <span class="mr-3">📄</span> Invoices
                </a>
                <a href="create-invoice.html" class="flex items-center px-4 py-3 text-slate-500 hover:text-slate-900 hover:bg-slate-50 rounded-lg mb-2 transition-all duration-200">
                    <span class="mr-3">➕</span> Create Invoice
                </a>
                <a href="settings.html" class="flex items-center px-4 py-3 text-slate-500 hover:text-slate-900 hover:bg-slate-50 rounded-lg mb-2 transition-all duration-200">
                    <span class="mr-3">⚙️</span> Settings
                </a>
            </nav>
            <div class="absolute bottom-0 w-full p-4 border-t border-slate-200">
                <button onclick="logout()" class="w-full flex items-center px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition">
                    <span class="mr-3">🚪</span> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">Welcome back!</h2>
                    <p class="text-slate-500">Here's what's happening with your invoices today.</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition" onclick="window.location.href='create-invoice.html'">New Invoice</button>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                <div class="bg-white p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all duration-300">
                    <p class="text-sm font-semibold text-slate-400 mb-1 uppercase tracking-wider">Total Invoices</p>
                    <h3 class="text-4xl font-black text-slate-900" id="stat-total">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all duration-300">
                    <p class="text-sm font-semibold text-slate-400 mb-1 uppercase tracking-wider">Paid Invoices</p>
                    <h3 class="text-4xl font-black text-green-600" id="stat-paid">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all duration-300">
                    <p class="text-sm font-semibold text-slate-400 mb-1 uppercase tracking-wider">Unpaid Invoices</p>
                    <h3 class="text-4xl font-black text-orange-500" id="stat-unpaid">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all duration-300">
                    <p class="text-sm font-semibold text-slate-400 mb-1 uppercase tracking-wider">Overdue Invoices</p>
                    <h3 class="text-4xl font-black text-red-600" id="stat-overdue">0</h3>
                </div>
            </div>

            <!-- Recent Invoices Table (Brief) -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                    <h4 class="font-bold text-slate-900">Recent Invoices</h4>
                    <a href="invoices.html" class="text-sm text-blue-600 font-medium">View all</a>
                </div>
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-slate-500 text-sm uppercase">
                        <tr>
                            <th class="px-6 py-3 font-medium">Client</th>
                            <th class="px-6 py-3 font-medium">Amount</th>
                            <th class="px-6 py-3 font-medium">Due Date</th>
                            <th class="px-6 py-3 font-medium">Status</th>
                        </tr>
                    </thead>
                    <tbody id="recent-invoices-tbody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        async function loadDashboard() {
            const stats = await fetchWithAuth('/invoices/stats/summary');
            if (stats) {
                document.getElementById('stat-total').textContent = stats.total;
                document.getElementById('stat-paid').textContent = stats.paid;
                document.getElementById('stat-unpaid').textContent = stats.unpaid;
                document.getElementById('stat-overdue').textContent = stats.overdue;
            }

            const invoices = await fetchWithAuth('/invoices/');
            if (invoices) {
                const tbody = document.getElementById('recent-invoices-tbody');
                tbody.innerHTML = invoices.slice(0, 5).map(inv => `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition">
                        <td class="px-6 py-4">
                            <p class="font-medium text-slate-900">${inv.client_name}</p>
                            <p class="text-xs text-slate-500">${inv.client_email}</p>
                        </td>
                        <td class="px-6 py-4 font-medium text-slate-900">${inv.currency} ${inv.amount}</td>
                        <td class="px-6 py-4 text-slate-600">${new Date(inv.due_date).toLocaleDateString()}</td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${inv.status === 'paid' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}">
                                ${inv.status.toUpperCase()}
                            </span>
                        </td>
                    </tr>
                `).join('');
            }
        }
        loadDashboard();
    </script>
</body>
</html>
