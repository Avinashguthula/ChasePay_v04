<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChasePay - All Invoices</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: theme('colors.bg');
      color: theme('colors.text');
    }
    h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'IBM Plex Mono', monospace; }
    
    .modal { transition: opacity 0.25s ease, visibility 0.25s ease; }
    body.modal-active { overflow-x: hidden; overflow-y: hidden; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Navbar (Dark) -->
  <header class="bg-dark text-white h-14 flex items-center justify-between px-6 sticky top-0 z-40">
    <div class="flex items-center gap-6">
      <a href="dashboard.html" class="font-heading font-bold text-xl tracking-tighter text-white">
        CHASE<span class="text-amber">PAY</span>
      </a>
      <div class="hidden md:flex items-center gap-4 text-xs font-mono font-medium text-gray-400">
        <a href="#" class="hover:text-white transition-colors flex items-center gap-1">Org <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></a>
        <span class="text-gray-600">/</span>
        <a href="#" class="hover:text-white transition-colors flex items-center gap-1">Workspace <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></a>
      </div>
    </div>
    <div class="flex items-center gap-4 text-xs font-mono font-medium text-gray-400">
      <a href="#" class="hover:text-white transition-colors">Feedback</a>
      <button class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center hover:text-white hover:border-white transition-colors">?</button>
      <button onclick="logout()" class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center hover:text-red hover:border-red transition-colors" title="Logout">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Left Sidebar -->
    <aside class="w-60 bg-[#EFEFEA] border-r border-border h-[calc(100vh-3.5rem)] sticky top-14 overflow-y-auto hidden md:block shrink-0">
      <div class="py-6 flex flex-col gap-8">
        
        <!-- Nav Group -->
        <div>
          <h4 class="px-6 text-[10px] font-mono uppercase tracking-widest text-muted mb-2 font-bold">Billing</h4>
          <nav class="flex flex-col">
            <a href="dashboard.html" class="flex items-center px-6 py-2.5 text-sm font-medium text-muted hover:text-text hover:bg-white/30 border-l-[3px] border-transparent transition-colors">
              <span class="mr-3 opacity-60"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg></span>
              Overview
            </a>
            <a href="invoices.html" class="flex items-center px-6 py-2.5 text-sm font-medium text-text bg-white/50 border-l-[3px] border-amber relative">
              <span class="mr-3 text-amber"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></span>
              Invoices
            </a>
            <a href="create-invoice.html" class="flex items-center px-6 py-2.5 text-sm font-medium text-muted hover:text-text hover:bg-white/30 border-l-[3px] border-transparent transition-colors">
              <span class="mr-3 opacity-60"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></span>
              Create Invoice
            </a>
          </nav>
        </div>

        <!-- Environment Group -->
        <div>
          <h4 class="px-6 text-[10px] font-mono uppercase tracking-widest text-muted mb-2 font-bold">Environment</h4>
          <nav class="flex flex-col">
            <a href="settings.html" class="flex items-center px-6 py-2.5 text-sm font-medium text-muted hover:text-text hover:bg-white/30 border-l-[3px] border-transparent transition-colors">
              <span class="mr-3 opacity-60"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></span>
              Settings
            </a>
          </nav>
        </div>

      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 lg:p-12 overflow-y-auto bg-card">
      <header class="flex justify-between items-end mb-8 border-b border-border pb-6">
        <div>
          <h1 class="font-heading font-bold text-3xl text-text mb-2">All Invoices</h1>
          <p class="text-sm text-muted">Manage, track, and update all your invoices.</p>
        </div>
        <div>
          <a href="create-invoice.html" class="px-5 py-2.5 bg-text text-white rounded-full text-xs font-mono font-bold uppercase tracking-widest hover:bg-muted transition-colors shadow-sm">
            New Invoice
          </a>
        </div>
      </header>

      <div class="bg-white border border-border rounded-2xl shadow-soft overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse min-w-[800px]">
            <thead class="bg-bg border-b border-border">
              <tr>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider">Client</th>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider">Amount</th>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider">Due Date</th>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider">Status</th>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider text-center">Last Reminder</th>
                <th class="px-6 py-4 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="invoices-tbody" class="divide-y divide-border">
              <!-- Loaded via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal opacity-0 invisible fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-dark/60 backdrop-blur-sm transition-opacity" onclick="toggleModal()"></div>
    <div class="bg-card w-full max-w-lg rounded-[28px] shadow-hover z-10 overflow-hidden transform transition-all border border-border relative">
      <div class="p-8">
        <div class="flex justify-between items-center mb-6">
          <h3 class="font-heading font-bold text-2xl text-text">Edit Invoice</h3>
          <button onclick="toggleModal()" class="text-muted hover:text-text transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        
        <form id="edit-form" class="space-y-4">
          <input type="hidden" id="edit-id">
          
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
              <label class="block text-xs font-mono font-bold uppercase tracking-wider text-muted">Client Name</label>
              <input type="text" id="edit-client-name" class="w-full h-11 px-4 rounded-xl border border-border bg-white text-text focus:outline-none focus:ring-2 focus:ring-amber/50 focus:border-amber transition-all text-sm">
            </div>
            <div class="space-y-2">
              <label class="block text-xs font-mono font-bold uppercase tracking-wider text-muted">Client Email</label>
              <input type="email" id="edit-client-email" class="w-full h-11 px-4 rounded-xl border border-border bg-white text-text focus:outline-none focus:ring-2 focus:ring-amber/50 focus:border-amber transition-all text-sm">
            </div>
            <div class="space-y-2">
              <label class="block text-xs font-mono font-bold uppercase tracking-wider text-muted">Amount</label>
              <input type="number" id="edit-amount" step="0.01" class="w-full h-11 px-4 rounded-xl border border-border bg-white text-text focus:outline-none focus:ring-2 focus:ring-amber/50 focus:border-amber transition-all text-sm font-mono">
            </div>
            <div class="space-y-2">
              <label class="block text-xs font-mono font-bold uppercase tracking-wider text-muted">Due Date</label>
              <input type="date" id="edit-due-date" class="w-full h-11 px-4 rounded-xl border border-border bg-white text-text focus:outline-none focus:ring-2 focus:ring-amber/50 focus:border-amber transition-all text-sm">
            </div>
          </div>
          
          <div class="space-y-2">
            <label class="block text-xs font-mono font-bold uppercase tracking-wider text-muted">Description</label>
            <textarea id="edit-description" rows="2" class="w-full p-3 rounded-xl border border-border bg-white text-text focus:outline-none focus:ring-2 focus:ring-amber/50 focus:border-amber transition-all text-sm resize-none"></textarea>
          </div>
          
          <div class="space-y-2">
            <label class="block text-xs font-mono font-bold uppercase tracking-wider text-muted">Status</label>
            <select id="edit-status" class="w-full h-11 px-4 rounded-xl border border-border bg-white text-text focus:outline-none focus:ring-2 focus:ring-amber/50 focus:border-amber transition-all text-sm font-mono">
              <option value="unpaid">UNPAID</option>
              <option value="paid">PAID</option>
            </select>
          </div>
          
          <div class="flex justify-end gap-3 pt-6 border-t border-border mt-6">
            <button type="button" onclick="toggleModal()" class="px-6 py-2.5 rounded-full border border-border text-text text-xs font-mono font-bold uppercase tracking-widest hover:bg-bg transition-colors">Cancel</button>
            <button type="submit" class="px-6 py-2.5 bg-amber text-text rounded-full text-xs font-mono font-bold uppercase tracking-widest hover:bg-[#F2A900] shadow-[0_4px_14px_rgba(255,178,0,0.39)] transition-colors">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div id="view-modal" class="modal opacity-0 invisible fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-dark/60 backdrop-blur-sm transition-opacity" onclick="toggleViewModal()"></div>
    <div class="bg-card w-full max-w-lg rounded-[28px] shadow-hover z-10 overflow-hidden transform transition-all border border-border relative">
      <div class="p-8">
        <div class="flex justify-between items-center mb-6 border-b border-border pb-4">
          <h3 class="font-heading font-bold text-2xl text-text">Invoice Details</h3>
          <button onclick="toggleViewModal()" class="text-muted hover:text-text transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        
        <div id="view-details" class="space-y-6">
          <!-- Loaded via JS -->
        </div>
        
        <div class="flex justify-end pt-6 border-t border-border mt-8">
          <button type="button" onclick="toggleViewModal()" class="px-6 py-2.5 rounded-full border border-border text-text text-xs font-mono font-bold uppercase tracking-widest hover:bg-bg transition-colors">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    let currentInvoices = [];

    function toggleModal() {
      const modal = document.getElementById('edit-modal');
      const isHidden = modal.classList.contains('opacity-0');
      if (isHidden) {
        modal.classList.remove('opacity-0', 'invisible');
        document.body.classList.add('modal-active');
      } else {
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('invisible'), 250);
        document.body.classList.remove('modal-active');
      }
    }

    function toggleViewModal() {
      const modal = document.getElementById('view-modal');
      const isHidden = modal.classList.contains('opacity-0');
      if (isHidden) {
        modal.classList.remove('opacity-0', 'invisible');
        document.body.classList.add('modal-active');
      } else {
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('invisible'), 250);
        document.body.classList.remove('modal-active');
      }
    }

    async function loadInvoices() {
      const invoices = await fetchWithAuth('/invoices/');
      if (invoices) {
        currentInvoices = invoices;
        const tbody = document.getElementById('invoices-tbody');
        tbody.innerHTML = invoices.map(inv => `
          <tr class="hover:bg-bg transition-colors group">
            <td class="px-6 py-4 border-l-[3px] border-transparent group-hover:border-amber transition-colors">
              <p class="font-medium text-sm text-text">${inv.client_name}</p>
              <p class="text-[11px] text-muted font-mono mt-1">${inv.invoice_number || 'N/A'}</p>
            </td>
            <td class="px-6 py-4 font-mono font-semibold text-sm text-text">${inv.currency} ${inv.amount.toLocaleString()}</td>
            <td class="px-6 py-4 text-sm text-muted">${new Date(inv.due_date).toLocaleDateString()}</td>
            <td class="px-6 py-4">
              <span class="inline-flex items-center px-2 py-1 rounded text-[10px] font-mono font-bold uppercase tracking-wider ${inv.status === 'paid' ? 'bg-green/10 text-green border border-green/20' : 'bg-amber/10 text-amber border border-amber/20'}">
                ${inv.status}
              </span>
            </td>
            <td class="px-6 py-4 text-center">
              ${inv.last_reminder ? `
                <span class="inline-flex px-2 py-1 rounded bg-blue/10 text-blue text-[10px] font-mono font-bold uppercase border border-blue/20">
                  ${inv.last_reminder} Sent
                </span>
              ` : `
                <span class="text-muted text-[10px] font-mono italic">No reminders</span>
              `}
            </td>
            <td class="px-6 py-4 text-right">
              <div class="flex items-center justify-end gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
                <button onclick="viewInvoice('${inv.id}')" class="text-[11px] font-mono font-bold text-muted hover:text-text uppercase transition-colors" title="View">View</button>
                <button onclick="toggleStatus('${inv.id}', '${inv.status}')" class="text-[11px] font-mono font-bold ${inv.status === 'unpaid' ? 'text-green hover:text-[#009e38]' : 'text-amber hover:text-[#e09d00]'} uppercase transition-colors" title="Toggle Status">
                  ${inv.status === 'unpaid' ? 'Paid' : 'Unpaid'}
                </button>
                <button onclick="openEditModal('${inv.id}')" class="text-[11px] font-mono font-bold text-blue hover:text-[#036be5] uppercase transition-colors" title="Edit">Edit</button>
                <button onclick="deleteInvoice('${inv.id}')" class="text-[11px] font-mono font-bold text-red hover:text-[#c92f2f] uppercase transition-colors" title="Delete">Del</button>
              </div>
            </td>
          </tr>
        `).join('');
        
        if (invoices.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-muted">No invoices found. <a href="create-invoice.html" class="text-blue hover:underline">Create one</a></td></tr>`;
        }
      }
    }

    async function toggleStatus(id, currentStatus) {
      const newStatus = currentStatus === 'unpaid' ? 'paid' : 'unpaid';
      const res = await fetchWithAuth(`/invoices/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ status: newStatus })
      });
      if (res) loadInvoices();
    }

    function viewInvoice(id) {
      const inv = currentInvoices.find(i => i.id === id);
      if (inv) {
        const details = document.getElementById('view-details');
        details.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <p class="text-[10px] font-mono font-bold text-blue uppercase tracking-widest mb-1">${inv.last_reminder || 'NO REMINDERS'}</p>
              <p class="text-[10px] font-mono font-bold text-muted uppercase tracking-widest mb-1 mt-4">Client</p>
              <p class="text-xl font-heading font-bold text-text">${inv.client_name}</p>
              <p class="text-sm font-mono text-muted">${inv.client_email}</p>
            </div>
            <div class="text-right">
              <p class="text-[10px] font-mono font-bold text-muted uppercase tracking-widest mb-2">Status</p>
              <span class="inline-flex items-center px-3 py-1 rounded-full text-[10px] font-mono font-bold uppercase tracking-wider ${inv.status === 'paid' ? 'bg-green/10 text-green border border-green/20' : 'bg-amber/10 text-amber border border-amber/20'}">
                <span class="w-1.5 h-1.5 rounded-full mr-2 ${inv.status === 'paid' ? 'bg-green' : 'bg-amber'}"></span>
                ${inv.status}
              </span>
            </div>
          </div>
          
          <div class="bg-blue/5 rounded-2xl p-6 border border-blue/20">
            <div class="grid grid-cols-2 gap-6">
              <div>
                <p class="text-[10px] font-mono font-bold text-blue uppercase tracking-widest mb-1">Total Amount</p>
                <p class="text-3xl font-heading font-bold text-blue">${inv.currency} ${inv.amount.toLocaleString()}</p>
              </div>
              <div class="text-right">
                <p class="text-[10px] font-mono font-bold text-blue uppercase tracking-widest mb-1">Due Date</p>
                <p class="text-lg font-mono font-bold text-text">${new Date(inv.due_date).toLocaleDateString()}</p>
              </div>
            </div>
          </div>

          <div>
            <p class="text-[10px] font-mono font-bold text-muted uppercase tracking-widest mb-2">Description</p>
            <div class="bg-bg rounded-xl p-4 border border-border">
              <p class="text-sm text-text leading-relaxed">${inv.description || '<span class="text-muted italic">No description provided</span>'}</p>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="flex items-center p-4 bg-bg rounded-xl border border-border">
              <div class="w-10 h-10 rounded-xl bg-blue/10 text-blue flex items-center justify-center mr-3 text-lg">🔔</div>
              <div>
                <p class="text-[10px] font-mono font-bold text-muted uppercase tracking-widest mb-0.5">Last Reminder</p>
                <p class="text-xs font-bold text-text">${inv.last_reminder ? inv.last_reminder + ' Sent' : 'None yet'}</p>
              </div>
            </div>
            <div class="flex items-center p-4 bg-bg rounded-xl border border-border overflow-hidden">
              <div class="w-10 h-10 rounded-xl bg-card border border-border flex items-center justify-center mr-3 text-lg">🆔</div>
              <div class="overflow-hidden">
                <p class="text-[10px] font-mono font-bold text-muted uppercase tracking-widest mb-0.5">Invoice ID</p>
                <p class="text-[10px] font-mono text-text truncate" title="${inv.invoice_number || 'N/A'}">${inv.invoice_number || 'N/A'}</p>
              </div>
            </div>
          </div>
        `;
        toggleViewModal();
      }
    }

    function openEditModal(id) {
      const inv = currentInvoices.find(i => i.id === id);
      if (inv) {
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-amount').value = inv.amount;
        document.getElementById('edit-due-date').value = inv.due_date;
        document.getElementById('edit-status').value = inv.status;
        document.getElementById('edit-description').value = inv.description || '';
        document.getElementById('edit-client-name').value = inv.client_name;
        document.getElementById('edit-client-email').value = inv.client_email;
        toggleModal();
      }
    }

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const payload = {
        amount: parseFloat(document.getElementById('edit-amount').value),
        due_date: document.getElementById('edit-due-date').value,
        status: document.getElementById('edit-status').value,
        description: document.getElementById('edit-description').value,
        client_name: document.getElementById('edit-client-name').value,
        client_email: document.getElementById('edit-client-email').value
      };

      const res = await fetchWithAuth(`/invoices/${id}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (res) {
        toggleModal();
        loadInvoices();
      }
    });

    async function deleteInvoice(id) {
      if (confirm('Are you sure you want to delete this invoice? This action cannot be undone.')) {
        const res = await fetchWithAuth(`/invoices/${id}`, { method: 'DELETE' });
        if (res) loadInvoices();
      }
    }

    loadInvoices();
  </script>
</body>
</html>
