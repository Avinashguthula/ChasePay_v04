<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChasePay — Update Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: theme('colors.bg');
      color: theme('colors.text');
      background-image: 
        linear-gradient(to right, rgba(215, 215, 208, 0.5) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(215, 215, 208, 0.5) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'IBM Plex Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative">

  <!-- Mux-style Border -->
  <div class="fixed top-0 left-0 w-2 h-full bg-gradient-to-b from-green via-blue to-purple z-0"></div>
  <div class="fixed top-0 left-2 w-px h-full bg-border z-0"></div>

  <div class="w-full max-w-md mx-auto relative z-10">
    <div class="bg-card rounded-[36px] shadow-hover border border-border p-10 relative overflow-hidden">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <a href="index.html" class="inline-block font-heading font-bold text-2xl tracking-tighter text-text mb-4">
          CHASE<span class="text-green">PAY</span>
        </a>
        <h1 class="font-heading text-2xl font-bold mb-2">Set new password</h1>
        <p class="text-sm text-muted">Choose a strong password to secure your account.</p>
      </div>

      <!-- Form Container -->
      <div class="space-y-4">
        
        <div>
          <label class="block text-[10px] font-mono font-bold uppercase tracking-widest text-muted mb-2 px-1">New Password</label>
          <div class="relative">
            <input type="password" id="new-password" class="w-full h-12 px-4 rounded-xl border border-border bg-white text-text focus:outline-none focus:ring-2 focus:ring-green/50 focus:border-green transition-all" placeholder="Min 8 characters">
            <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-muted hover:text-text" onclick="togglePw('new-password')">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-mono font-bold uppercase tracking-widest text-muted mb-2 px-1">Confirm Password</label>
          <div class="relative">
            <input type="password" id="confirm-password" class="w-full h-12 px-4 rounded-xl border border-border bg-white text-text focus:outline-none focus:ring-2 focus:ring-green/50 focus:border-green transition-all" placeholder="Repeat new password">
            <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-muted hover:text-text" onclick="togglePw('confirm-password')">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>
        </div>
        
        <button id="update-btn" class="w-full h-12 rounded-full bg-text text-white font-mono font-bold text-xs tracking-widest hover:bg-muted transition-colors mt-4">
          UPDATE PASSWORD
        </button>
        
      </div>
      
      <!-- Status Message -->
      <div id="status-msg" class="hidden mt-6 p-4 rounded-xl text-sm font-medium text-center border"></div>
    </div>
  </div>

  <script>
    function togglePw(id) {
      const el = document.getElementById(id);
      if (el.type === 'password') {
        el.type = 'text';
      } else {
        el.type = 'password';
      }
    }

    const getHashToken = () => {
      const hash = window.location.hash;
      if (hash) {
        const params = new URLSearchParams(hash.substring(1));
        return params.get('access_token');
      }
      return null;
    };

    document.getElementById('update-btn').addEventListener('click', async () => {
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      const btn = document.getElementById('update-btn');
      const msg = document.getElementById('status-msg');
      const token = getHashToken();

      if (!token) {
        msg.textContent = 'Invalid or expired session. Please request a new reset link.';
        msg.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center border border-red/20 bg-red/5 text-red';
        msg.classList.remove('hidden');
        return;
      }

      if (!password || password.length < 8) {
        msg.textContent = 'Password must be at least 8 characters';
        msg.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center border border-red/20 bg-red/5 text-red';
        msg.classList.remove('hidden');
        return;
      }

      if (password !== confirm) {
        msg.textContent = 'Passwords do not match';
        msg.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center border border-red/20 bg-red/5 text-red';
        msg.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'UPDATING...';

      try {
        const response = await fetch('http://localhost:8000/api/auth/update-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, token })
        });

        if (response.ok) {
          msg.textContent = 'Password updated! Redirecting to login...';
          msg.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center border border-green/20 bg-green/5 text-green';
          msg.classList.remove('hidden');
          setTimeout(() => window.location.href = 'login.html', 2000);
        } else {
          const data = await response.json();
          msg.textContent = data.detail || 'Failed to update password';
          msg.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center border border-red/20 bg-red/5 text-red';
          msg.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'UPDATE PASSWORD';
        }
      } catch (error) {
        msg.textContent = 'Server error. Please try again.';
        msg.className = 'mt-6 p-4 rounded-xl text-sm font-medium text-center border border-red/20 bg-red/5 text-red';
        msg.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'UPDATE PASSWORD';
      }
    });
  </script>
</body>
</html>
